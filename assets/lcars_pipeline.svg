<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%" style="background:#050508; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="lcarsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FFCC66" />
      <stop offset="100%" stop-color="#CC6699" />
    </linearGradient>
  </defs>

  <!-- LCARS Top Left Elbow Frame -->
  <path d="M 30,85 L 30,35 Q 30,20 45,20 L 260,20 Q 275,20 275,35 L 275,45 Q 275,55 260,55 L 75,55 Q 60,55 60,70 L 60,85 Z" fill="#FF9900" />
  
  <!-- LCARS Top Horizontal Header Bars -->
  <rect x="285" y="20" width="160" height="35" rx="6" fill="#CC6699" />
  <rect x="453" y="20" width="220" height="35" rx="6" fill="#9999FF" />
  <rect x="681" y="20" width="189" height="35" rx="6" fill="#FFCC66" />
  
  <!-- Header Text -->
  <text x="80" y="43" fill="#000000" font-weight="900" font-size="14" letter-spacing="2">L.C.A.R.S. ARCHITECTURE</text>
  <text x="295" y="42" fill="#000000" font-weight="800" font-size="12" letter-spacing="1">SYS // 041-APS</text>
  <text x="465" y="42" fill="#000000" font-weight="800" font-size="12" letter-spacing="1">TELEMETRY: ACTIVE</text>
  <text x="695" y="42" fill="#000000" font-weight="800" font-size="12" letter-spacing="1">HERMETIC GATE: 100%</text>

  <!-- LCARS Left Spine & Key Badges -->
  <rect x="30" y="95" width="30" height="40" rx="4" fill="#9999FF" />
  <rect x="30" y="142" width="30" height="85" rx="4" fill="#FFCC66" />
  <rect x="30" y="234" width="30" height="76" rx="4" fill="#CC6699" />

  <!-- Title / System Designation -->
  <text x="80" y="95" fill="#FF9900" font-weight="900" font-size="16" letter-spacing="1.5">LOGIC CONDENSATION &amp; AUTONOMOUS ROUTING SYSTEM</text>
  <text x="80" y="115" fill="#8892B0" font-weight="600" font-size="12" letter-spacing="0.5">CLOSED-LOOP DETERMINISTIC PIPELINE // CYBERNETIC AUTOMATA FLOW</text>

  <!-- Flow Boxes -->
  
  <!-- 1. LLM Core -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="115" height="58" rx="10" fill="#14141E" stroke="#FF9900" stroke-width="2" />
    <rect x="6" y="6" width="22" height="12" rx="3" fill="#FF9900" />
    <text x="17" y="15" fill="#000" font-size="8" font-weight="900" text-anchor="middle">01</text>
    <text x="57" y="32" fill="#FFF" font-weight="800" font-size="14" text-anchor="middle">LLM</text>
    <text x="57" y="46" fill="#FF9900" font-weight="600" font-size="9" text-anchor="middle">Cognitive Core</text>
  </g>

  <!-- Vector Arrow 1 -->
  <path d="M 205,169 L 230,169" stroke="#FFCC66" stroke-width="3" />
  <polygon points="235,169 227,164 227,174" fill="#FFCC66" />

  <!-- 2. CMPS -->
  <g transform="translate(245, 140)">
    <rect x="0" y="0" width="125" height="58" rx="10" fill="#14141E" stroke="#9999FF" stroke-width="2" />
    <rect x="6" y="6" width="22" height="12" rx="3" fill="#9999FF" />
    <text x="17" y="15" fill="#000" font-size="8" font-weight="900" text-anchor="middle">02</text>
    <text x="62" y="32" fill="#FFF" font-weight="800" font-size="14" text-anchor="middle">CMPS</text>
    <text x="62" y="46" fill="#9999FF" font-weight="600" font-size="9" text-anchor="middle">Machine Sequencer</text>
  </g>

  <!-- Vector Arrow 2 -->
  <path d="M 380,169 L 405,169" stroke="#9999FF" stroke-width="3" />
  <polygon points="410,169 402,164 402,174" fill="#9999FF" />

  <!-- 3. SAPO -->
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="125" height="58" rx="10" fill="#14141E" stroke="#FFCC66" stroke-width="2" />
    <rect x="6" y="6" width="22" height="12" rx="3" fill="#FFCC66" />
    <text x="17" y="15" fill="#000" font-size="8" font-weight="900" text-anchor="middle">03</text>
    <text x="62" y="32" fill="#FFF" font-weight="800" font-size="14" text-anchor="middle">SAPO</text>
    <text x="62" y="46" fill="#FFCC66" font-weight="600" font-size="9" text-anchor="middle">Pipeline Output</text>
  </g>

  <!-- Vector Arrow 3 -->
  <path d="M 555,169 L 580,169" stroke="#CC6699" stroke-width="3" />
  <polygon points="585,169 577,164 577,174" fill="#CC6699" />

  <!-- 4. DVE Gate -->
  <g transform="translate(595, 140)">
    <rect x="0" y="0" width="120" height="58" rx="10" fill="#14141E" stroke="#CC6699" stroke-width="2" />
    <rect x="6" y="6" width="22" height="12" rx="3" fill="#CC6699" />
    <text x="17" y="15" fill="#000" font-size="8" font-weight="900" text-anchor="middle">04</text>
    <text x="60" y="32" fill="#FFF" font-weight="800" font-size="14" text-anchor="middle">DVE</text>
    <text x="60" y="46" fill="#CC6699" font-weight="600" font-size="9" text-anchor="middle">Logic Gate Matrix</text>
  </g>

  <!-- Vector Branch Right (Success -> HPR) -->
  <path d="M 725,169 L 750,169" stroke="#00E699" stroke-width="3" />
  <polygon points="755,169 747,164 747,174" fill="#00E699" />

  <!-- 5. HPR Terminal Node -->
  <g transform="translate(765, 140)">
    <rect x="0" y="0" width="105" height="58" rx="10" fill="#0C241B" stroke="#00E699" stroke-width="2" />
    <rect x="6" y="6" width="22" height="12" rx="3" fill="#00E699" />
    <text x="17" y="15" fill="#000" font-size="8" font-weight="900" text-anchor="middle">OK</text>
    <text x="52" y="32" fill="#00E699" font-weight="900" font-size="14" text-anchor="middle">HPR</text>
    <text x="52" y="46" fill="#80FFD4" font-weight="700" font-size="9" text-anchor="middle">Production Release</text>
  </g>

  <!-- Feedback Loop Down and Left (CLR) -->
  <path d="M 655,205 L 655,255 Q 655,265 645,265 L 145,265 Q 135,265 135,255 L 135,208" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="135,202 130,210 140,210" fill="#FF9900" />
  
  <!-- CLR Pill in Loop -->
  <g transform="translate(310, 248)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#1A150A" stroke="#FF9900" stroke-width="1.5" />
    <text x="100" y="17" fill="#FFCC66" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">CLR // CYBERNETIC LOOP REFLEXION</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <line x1="80" y1="300" x2="870" y2="300" stroke="#2D3748" stroke-width="1" />
  <text x="80" y="316" fill="#718096" font-size="10" font-weight="600" letter-spacing="1">PROTOCOL: APS-STD // COLD-IRON DETERMINISTIC VERIFICATION // ZERO AD-HOC DRIFT</text>
  <text x="870" y="316" fill="#00E699" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">STATUS: HERMETIC</text>
</svg>
