<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%" style="background:#060A06; font-family:'Courier New', Consolas, Monaco, monospace;">
  <defs>
    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-width="0.3" opacity="0.15" />
    </pattern>
    <!-- Glow Filters -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Scanlines & CRT Bezel -->
  <rect x="0" y="0" width="960" height="410" fill="#060A06" />
  <rect x="0" y="0" width="960" height="410" fill="url(#scanlines)" />
  <rect x="15" y="15" width="930" height="380" rx="14" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.7" />
  <rect x="19" y="19" width="922" height="372" rx="10" fill="none" stroke="#00FF66" stroke-width="0.8" opacity="0.3" />

  <!-- TOP BANNER: PATHWAY TO L.C.A.R.S. GOAL // IN DEVELOPMENT -->
  <g transform="translate(35, 28)">
    <rect x="0" y="0" width="890" height="28" rx="4" fill="#1A1405" stroke="#FFB800" stroke-width="1.5" />
    <!-- Blinking / Development Indicator -->
    <circle cx="18" cy="14" r="5" fill="#FFB800" filter="url(#amberGlow)" />
    <text x="32" y="18" fill="#FFB800" font-size="11" font-weight="900" letter-spacing="1.5">ROADMAP: PATHWAY TO L.C.A.R.S. ARCHITECTURE</text>
    <rect x="715" y="5" width="160" height="18" rx="3" fill="#FFB800" />
    <text x="795" y="17" fill="#000" font-size="9.5" font-weight="900" text-anchor="middle" letter-spacing="1">&gt;&gt; IN DEVELOPMENT &lt;&lt;</text>
  </g>

  <!-- CRT Terminal Main Header -->
  <rect x="35" y="64" width="890" height="32" rx="4" fill="#0A180A" stroke="#00FF66" stroke-width="1.2" />
  <text x="50" y="85" fill="#00FF66" font-size="13" font-weight="900" letter-spacing="2">&gt;&gt; AUGMENTED PIPELINE SYSTEMS (APS) // RUNTIME TELEMETRY</text>
  <rect x="735" y="70" width="85" height="20" rx="3" fill="#FFB800" />
  <text x="777" y="84" fill="#000" font-size="10" font-weight="900" text-anchor="middle">ONLINE</text>
  <rect x="830" y="70" width="85" height="20" rx="3" fill="#00FF66" />
  <text x="872" y="84" fill="#000" font-size="10" font-weight="900" text-anchor="middle">HERMETIC</text>

  <!-- Sub-Header Architecture Legend -->
  <text x="50" y="116" fill="#FFB800" font-size="10.5" font-weight="700" letter-spacing="1.5">HYBRID TOPOLOGY: [CLOUD COGNITIVE MODEL] ───&gt; [LOCAL SILICON MICROCHIPS] ───&gt; [OUTPUT]</text>

  <!-- ========================================================================= -->
  <!-- NODE 1: CLOUD AROUND LLM (AMBER / YELLOW PHOSPHOR)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 142)">
    <!-- Decorative Cloud Outline Path -->
    <path d="M 40,75 
             A 26,26 0 0,1 25,40 
             A 30,30 0 0,1 55,10 
             A 42,42 0 0,1 115,8 
             A 32,32 0 0,1 155,30 
             A 28,28 0 0,1 170,60 
             A 25,25 0 0,1 150,90 
             A 32,32 0 0,1 100,95 
             A 28,28 0 0,1 40,75 Z" 
          fill="#1A1505" stroke="#FFB800" stroke-width="2.5" filter="url(#amberGlow)" />
    
    <!-- Cloud Status Badge -->
    <rect x="62" y="24" width="56" height="14" rx="3" fill="#FFB800" />
    <text x="90" y="35" fill="#000" font-size="8" font-weight="900" text-anchor="middle">CLOUD</text>
    
    <!-- LLM Label -->
    <text x="90" y="58" fill="#FFF" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">LLM</text>
    <text x="90" y="76" fill="#FFB800" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">Cognitive Core</text>
  </g>

  <!-- Bus Arrow 1 (Cloud -> Microchip 1) -->
  <g transform="translate(225, 192)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#FFB800" stroke-width="2.5" />
    <polygon points="42,0 32,-5 32,5" fill="#FFB800" />
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 2: LOCAL MICROCHIP 1 (CMPS) - NOTCHED DUAL-INLINE IC PACKAGE         -->
  <!-- ========================================================================= -->
  <g transform="translate(275, 142)">
    <!-- Microchip Metal Pin Legs (Top & Bottom) -->
    <rect x="20" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    
    <rect x="20" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />

    <!-- Notched Microchip Body (Upside Down Cup Notch at Top) -->
    <path d="M 6,0 L 58,0 A 12,12 0 0,1 82,0 L 134,0 Q 140,0 140,6 L 140,88 Q 140,94 134,94 L 6,94 Q 0,94 0,88 L 0,6 Q 0,0 6,0 Z" 
          fill="#0B140B" stroke="#00FF66" stroke-width="2.5" filter="url(#greenGlow)" />
    
    <!-- IC Index Dot (Pin 1 Indicator) -->
    <circle cx="16" cy="16" r="3.5" fill="#00FF66" />
    
    <!-- Chip Text -->
    <rect x="36" y="16" width="68" height="13" rx="2" fill="#00FF66" />
    <text x="70" y="26" fill="#000" font-size="8" font-weight="900" text-anchor="middle">LOCAL SILICON</text>
    
    <text x="70" y="55" fill="#FFF" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">CMPS</text>
    <text x="70" y="73" fill="#00FF66" font-size="8.5" font-weight="700" text-anchor="middle">Machine Sequencer</text>
  </g>

  <!-- Bus Arrow 2 (Microchip 1 -> Microchip 2) -->
  <g transform="translate(423, 192)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#00FF66" stroke-width="2.5" />
    <polygon points="38,0 28,-5 28,5" fill="#00FF66" />
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 3: LOCAL MICROCHIP 2 (SAPO / OUTPUT) WITH PROMINENT DOUBLE UNDERLINE -->
  <!-- ========================================================================= -->
  <g transform="translate(468, 142)">
    <!-- Microchip Metal Pin Legs -->
    <rect x="20" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    
    <rect x="20" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />

    <!-- Notched Microchip Body -->
    <path d="M 6,0 L 58,0 A 12,12 0 0,1 82,0 L 134,0 Q 140,0 140,6 L 140,88 Q 140,94 134,94 L 6,94 Q 0,94 0,88 L 0,6 Q 0,0 6,0 Z" 
          fill="#0B140B" stroke="#00FF66" stroke-width="2.5" filter="url(#greenGlow)" />
    
    <!-- Pin 1 Dot -->
    <circle cx="16" cy="16" r="3.5" fill="#00FF66" />
    
    <!-- Chip Header -->
    <rect x="36" y="16" width="68" height="13" rx="2" fill="#00FF66" />
    <text x="70" y="26" fill="#000" font-size="8" font-weight="900" text-anchor="middle">LOCAL SILICON</text>

    <!-- SAPO Text -->
    <text x="70" y="55" fill="#FFF" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">SAPO</text>
    
    <!-- OUTPUT WITH DOUBLE UNDERLINE -->
    <text x="70" y="73" fill="#FFB800" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">OUTPUT</text>
    <!-- Double Underline under OUTPUT -->
    <line x1="28" y1="78" x2="112" y2="78" stroke="#FFB800" stroke-width="2" />
    <line x1="28" y1="82" x2="112" y2="82" stroke="#FFB800" stroke-width="2" />
  </g>

  <!-- Bus Arrow 3 (Microchip 2 -> Microchip 3) -->
  <g transform="translate(616, 192)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#00FF66" stroke-width="2.5" />
    <polygon points="38,0 28,-5 28,5" fill="#00FF66" />
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 4: LOCAL MICROCHIP 3 (DVE) - LOGIC GATE / VERIFICATION               -->
  <!-- ========================================================================= -->
  <g transform="translate(660, 142)">
    <!-- Metal Pins -->
    <rect x="20" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="-8" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    
    <rect x="20" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="50" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="80" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />
    <rect x="110" y="92" width="10" height="10" fill="#FFB800" stroke="#997000" stroke-width="0.8" />

    <!-- Notched Body -->
    <path d="M 6,0 L 58,0 A 12,12 0 0,1 82,0 L 134,0 Q 140,0 140,6 L 140,88 Q 140,94 134,94 L 6,94 Q 0,94 0,88 L 0,6 Q 0,0 6,0 Z" 
          fill="#0B140B" stroke="#00FF66" stroke-width="2.5" filter="url(#greenGlow)" />
    
    <!-- Pin 1 Dot -->
    <circle cx="16" cy="16" r="3.5" fill="#00FF66" />
    
    <!-- Chip Header -->
    <rect x="36" y="16" width="68" height="13" rx="2" fill="#00FF66" />
    <text x="70" y="26" fill="#000" font-size="8" font-weight="900" text-anchor="middle">LOCAL GATE</text>

    <!-- DVE Text -->
    <text x="70" y="55" fill="#FFF" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">DVE</text>
    <text x="70" y="73" fill="#00FF66" font-size="8.5" font-weight="700" text-anchor="middle">Logic Gate Matrix</text>
  </g>

  <!-- Pass Branch Arrow (DVE -> HPR Release) -->
  <g transform="translate(808, 192)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#00FF66" stroke-width="2.5" />
    <polygon points="36,0 26,-5 26,5" fill="#00FF66" />
  </g>

  <!-- ========================================================================= -->
  <!-- NODE 5: HPR TERMINAL BADGE (HERMETIC PRODUCTION RELEASE)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(850, 157)">
    <rect x="0" y="0" width="75" height="65" rx="8" fill="#06240D" stroke="#00FF66" stroke-width="2" />
    <text x="37" y="24" fill="#00FF66" font-size="9" font-weight="900" text-anchor="middle">PASS</text>
    <text x="37" y="44" fill="#FFF" font-size="16" font-weight="900" text-anchor="middle">HPR</text>
    <text x="37" y="58" fill="#00FF66" font-size="8" font-weight="700" text-anchor="middle">Release</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CLOSED LOOP FEEDBACK: CLR ROUTING (FAIL / HEAL ROUTING BACK TO CLOUD LLM) -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 0)">
    <!-- Circuit Trace Path looping back from DVE to Cloud LLM -->
    <path d="M 730,252 L 730,305 Q 730,315 720,315 L 140,315 Q 130,315 130,305 L 130,252" 
          fill="none" stroke="#FFB800" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="130,244 125,254 135,254" fill="#FFB800" />
    
    <!-- Central Feedback Diagnostic Pill -->
    <g transform="translate(330, 301)">
      <rect x="0" y="0" width="280" height="26" rx="5" fill="#141005" stroke="#FFB800" stroke-width="1.5" />
      <text x="140" y="17" fill="#FFB800" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1.5">CLR // CYBERNETIC LOOP REFLEXION</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <line x1="35" y1="355" x2="925" y2="355" stroke="#00FF66" stroke-width="0.8" opacity="0.4" />
  <text x="50" y="372" fill="#00FF66" font-size="10" font-weight="700" letter-spacing="1">&gt;&gt; LOGIC GATES: DETERMINISTIC // RUNTIME: SUB-SECOND // AD-HOC SCRIPT DRIFT: 0.00%</text>
  <text x="910" y="372" fill="#FFB800" font-size="10" font-weight="900" text-anchor="end" letter-spacing="1">PHOSPHOR-APS-STD</text>
</svg>
